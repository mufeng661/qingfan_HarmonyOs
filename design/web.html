<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青番 · Web 端原型（功能与鸿蒙端一致）</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #F3F6EE;
      --surface: #FFFFFF;
      --surface-2: #EAF1E2;
      --ink: #2C3A28;
      --ink-2: #84917D;
      --ink-3: #B4BFAE;
      --leaf: #6E9B57;
      --leaf-deep: #4C7A3E;
      --leaf-soft: #DCE8CF;
      --tomato: #E07A5F;
      --tomato-soft: #F6E1D6;
      --line: #E3E9DB;
      --gold: #D9A441;
      --gold-soft: #F4E8CE;
      --bar: rgba(255,255,255,0.96);
      --stage-bg: #EDF2E8;
      --brand-grad-1: #F7FAF2;
      --brand-grad-2: #EAF1E2;
      --font-display: 'Songti SC', 'Noto Serif SC', 'STSong', 'SimSun', serif;
      --font-body: 'HarmonyOS Sans SC', 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
    }

    /* ---- 背景主题：深夜墨 ---- */
    :root[data-theme="dark"] {
      --bg: #171C17;
      --surface: #212822;
      --surface-2: #2B342B;
      --ink: #E6EDE3;
      --ink-2: #97A392;
      --ink-3: #677262;
      --leaf: #8CB56F;
      --leaf-deep: #A9CC8F;
      --leaf-soft: #33412F;
      --tomato: #ED8E72;
      --tomato-soft: #4A332B;
      --line: #333D32;
      --gold: #E2B65F;
      --gold-soft: #463A24;
      --bar: rgba(33,40,34,0.96);
      --stage-bg: #0F130E;
      --brand-grad-1: #1A211A;
      --brand-grad-2: #121712;
    }

    /* ---- 背景主题：晨光暖 ---- */
    :root[data-theme="dawn"] {
      --bg: #FBF3E9;
      --surface: #FFFDF9;
      --surface-2: #F3E7D7;
      --ink: #4A3A2B;
      --ink-2: #9A8A76;
      --ink-3: #C4B5A2;
      --leaf: #C08A4E;
      --leaf-deep: #A8743C;
      --leaf-soft: #EFDFC6;
      --tomato: #D96B4E;
      --tomato-soft: #F6E1D6;
      --line: #EDE0CE;
      --gold: #D9A441;
      --gold-soft: #F4E8CE;
      --bar: rgba(255,253,249,0.96);
      --stage-bg: #EFE6D8;
      --brand-grad-1: #FCF6EC;
      --brand-grad-2: #F1E6D4;
    }

    /* ---- 背景主题：静谧蓝 ---- */
    :root[data-theme="ocean"] {
      --bg: #EEF3F6;
      --surface: #FFFFFF;
      --surface-2: #E2ECF2;
      --ink: #26343F;
      --ink-2: #7C8E9A;
      --ink-3: #AEBFC8;
      --leaf: #5C8BA6;
      --leaf-deep: #42718C;
      --leaf-soft: #D8E6EE;
      --tomato: #E07A5F;
      --tomato-soft: #F6E1D6;
      --line: #DEE8EE;
      --gold: #D9A441;
      --gold-soft: #F4E8CE;
      --bar: rgba(255,255,255,0.96);
      --stage-bg: #E4ECF1;
      --brand-grad-1: #F3F8FA;
      --brand-grad-2: #E4EEF3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--stage-bg);
      color: var(--ink);
      transition: background 0.4s ease;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }
    #root { height: 100vh; width: 100vw; }
    .serif { font-family: var(--font-display); }

    /* 页面外层布局 */
    .stage-wrap {
      height: 100vh; width: 100vw;
      display: flex; align-items: center; justify-content: center;
      gap: 56px; padding: 40px;
    }
    .stage-side {
      width: 300px; flex-shrink: 0;
      display: flex; flex-direction: column; gap: 28px;
    }
    .stage-brand { display: flex; align-items: center; gap: 12px; }
    .stage-brand .mark { width: 44px; height: 44px; flex-shrink: 0; }
    .stage-brand .name { font-family: var(--font-display); font-size: 26px; letter-spacing: 0.02em; }
    .stage-brand .en { font-size: 11px; color: var(--ink-2); letter-spacing: 0.28em; margin-top: 2px; }
    .stage-tagline { font-family: var(--font-display); font-size: 15px; color: var(--ink-2); line-height: 1.7; }
    .stage-modules { display: flex; flex-direction: column; gap: 0; }
    .stage-modules .title { font-size: 12px; letter-spacing: 0.2em; color: var(--ink-3); margin-bottom: 14px; }
    .stage-module {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 0; font-size: 14px; color: var(--ink);
      border-bottom: 1px solid var(--line);
    }
    .stage-module .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--leaf); flex-shrink: 0; }
    .stage-module.done .dot { background: var(--tomato); }
    .stage-module .num { font-size: 11px; color: var(--ink-3); margin-left: auto; font-family: var(--font-display); }
    .stage-hint {
      font-size: 12.5px; color: var(--ink-2); line-height: 1.8;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 14px; padding: 14px 16px;
    }
    .stage-hint b { color: var(--leaf-deep); font-weight: 600; }

    .phone-col { display: flex; align-items: center; justify-content: center; }
    @media (max-width: 960px) {
      .stage-side { display: none; }
      .stage-wrap { gap: 0; padding: 20px; }
    }

    /* 通用动画 */
    @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes growIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes wave { 0%,100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }
    @keyframes leafSway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes confetti { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(-70px) rotate(40deg); opacity: 0; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    /* ============================================================

    function ScreenHome({ onStart, onAdd, signed, onSign, tasks, onToggleDone, onReorder, onAiSort, onOpenAi, challengeGoal, onEditGoal }) {
      const today = '9 月 2 日 · 周三';

      const focusMin = tasks.filter(t => t.done).reduce((a,b) => a + b.pomos * 25, 0);
      const [aiSorting, setAiSorting] = useState(false);
      const [dragIndex, setDragIndex] = useState(null);
      const [dropIndex, setDropIndex] = useState(null);
      const dragRef = useRef(null);
      const listRef = useRef(null);
      const CARD_H = 72;
      const runAiSort = () => { setAiSorting(true); setTimeout(() => { onAiSort(); setAiSorting(false); }, 1000); };
      const diffTag = (d) => {
        const map = { easy: { label: '简单', c: T.leaf, bg: T.leafSoft }, medium: { label: '中等', c: T.gold, bg: T.goldSoft }, hard: { label: '困难', c: T.tomato, bg: T.tomatoSoft } };
        const info = map[d] || map.medium;
        return <span style={{ fontSize: 10, padding: '2px 7px', borderRadius: 99, color: info.c, background: info.bg, fontWeight: 600, marginLeft: 6, flexShrink: 0 }}>{info.label}</span>;
      };
      const getOffset = (i) => {
        if (dragIndex === null || dropIndex === null || dragIndex === dropIndex) return 0;
        if (dragIndex < dropIndex) { if (i > dragIndex && i <= dropIndex) return -CARD_H; }
        else { if (i >= dropIndex && i < dragIndex) return CARD_H; }
        return 0;
      };
      const handlePointerDown = (e, index) => {
        if (tasks[index].done) return;
        const timer = setTimeout(() => {
          setDragIndex(index); setDropIndex(index);
          dragRef.current = { startY: e.clientY, index, currentY: e.clientY, dropIndex: index };
          document.body.style.userSelect = 'none';
        }, 400);
        let moveHandler = null;
        const upHandler = () => {
          clearTimeout(timer);
          if (moveHandler) window.removeEventListener('pointermove', moveHandler);
          if (dragRef.current) {
            const finalIdx = dragRef.current.dropIndex !== undefined ? dragRef.current.dropIndex : dragRef.current.index;
            if (finalIdx !== dragRef.current.index) onReorder(dragRef.current.index, finalIdx);
            setDragIndex(null); setDropIndex(null);
            dragRef.current = null; document.body.style.userSelect = '';
          }
        };
        moveHandler = (ev) => {
          if (!dragRef.current) return;
          dragRef.current.currentY = ev.clientY;
          const list = listRef.current; if (!list) return;
          const listRect = list.getBoundingClientRect();
          const idx = Math.max(0, Math.min(Math.round((ev.clientY - listRect.top) / CARD_H), tasks.length - 1));
          dragRef.current.dropIndex = idx;
          setDropIndex(idx);
        };
        window.addEventListener('pointerup', upHandler, { once: true });
        window.addEventListener('pointermove', moveHandler);
      };
      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: T.bg }}>
          <div style={{ padding: '22px 22px 12px' }}>

      const [total, setTotal] = useState(25 * 60);

      // 倒计时
      useEffect(() => {
        const t = setInterval(() => setRemaining(r => r > 0 ? r - 1 : 0), 1000);
        return () => clearInterval(t);
      }, []);
      useEffect(() => {
        if (remaining === 0 && !completed.current) {
          completed.current = true;
          onComplete();
        }
      }, [remaining]);

      const setDur = (m) => { setTotal(m * 60); setRemaining(m * 60); completed.current = false; };
      const mm = String(Math.floor(remaining / 60)).padStart(2, '0');
      const ss = String(remaining % 60).padStart(2, '0');
      const progress = 1 - remaining / total;
      const R = 92, CIRC = 2 * Math.PI * R;
      const isDark = bg.id === 'sky' || bg.id === 'dusk';

      return (
        <div style={{ height: '100%', position: 'relative', background: bg.css, transition: 'background 0.6s', color: isDark ? '#fff' : '#3a3328' }}>

                <circle cx="110" cy="110" r={R} fill="none" stroke="rgba(255,255,255,0.22)" strokeWidth="11" />
                <circle cx="110" cy="110" r={R} fill="none" stroke="#fff" strokeWidth="11" strokeLinecap="round"
                  strokeDasharray={CIRC} strokeDashoffset={CIRC * progress} transform="rotate(-90 110 110)" style={{ transition: 'stroke-dashoffset 1s linear' }} />
              </svg>
              <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>

            </div>

            {/* 时长切换 */}
            <div style={{ display: 'flex', gap: 8, marginTop: 22 }}>
              {DURATIONS.map(d => {
                const active = total === d * 60;
                return (
                  <div key={d} onClick={() => setDur(d)} style={{ cursor: 'pointer', padding: '5px 14px', borderRadius: 99, fontSize: 12.5, background: active ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.22)', color: active ? (isDark ? T.leafDeep : T.tomato) : 'inherit', fontWeight: active ? 700 : 500 }}>{d} 分</div>
                );
              })}
            </div>
          </div>

          <div style={{ position: 'absolute', left: 24, right: 24, bottom: 30 }}>
            {/* 背景切换 */}
            <div style={{ fontSize: 12, opacity: 0.75, marginBottom: 10 }}>专注背景</div>
            <div style={{ display: 'flex', gap: 10, marginBottom: 18 }}>
              {BG_THEMES.map(b => (
                <div key={b.id} onClick={() => setBg(b)} style={{ flex: 1, cursor: 'pointer' }}>
                  <div style={{ height: 44, borderRadius: 12, background: b.css, border: bg.id === b.id ? '2.5px solid #fff' : '2px solid transparent', boxShadow: bg.id === b.id ? '0 0 0 3px rgba(255,255,255,0.25)' : 'none', transition: 'all 0.2s' }} />
                  <div style={{ textAlign: 'center', fontSize: 11, marginTop: 5, opacity: 0.8 }}>{b.name}</div>
                </div>

            </div>
            {/* 音乐切换 */}
            <div style={{ fontSize: 12, opacity: 0.75, marginBottom: 10 }}>白噪音</div>
            <div style={{ display: 'flex', gap: 8, marginBottom: 22 }}>
              {MUSICS.map(m => {
                const active = music.id === m.id;
                return (
                  <div key={m.id} onClick={() => setMusic(m)} style={{ flex: 1, cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, padding: '10px 0', borderRadius: 12, background: active ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.12)', border: active ? '1px solid rgba(255,255,255,0.6)' : '1px solid transparent' }}>
                    {m.icon(18)}

                  <div onClick={onQuit} style={{ flex: 1, padding: '12px', borderRadius: 13, background: T.tomato, color: '#fff', fontSize: 14, cursor: 'pointer', textAlign: 'center' }}>退出</div>
                </div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

        { id: '311b7236-a264-4cd1-bfe1-a57ddff2fc55', name: '考研冲刺营', role: 'member', member_count: 23, need_password: true, created_at: Date.now() - 7200e3 },

      const [newName, setNewName] = useState('');
      const [usePwd, setUsePwd] = useState(false);
      const [newPwd, setNewPwd] = useState('');
      const [showJoin, setShowJoin] = useState(false);
      const [joinCode, setJoinCode] = useState('');
      const [joinPwd, setJoinPwd] = useState('');
      const [board, setBoard] = useState(null);
      const [msgs, setMsgs] = useState([]);
      const [msgInput, setMsgInput] = useState('');
      const [replyTo, setReplyTo] = useState(null);
      const [confirmRoom, setConfirmRoom] = useState(null);

      const fmt = (ts) => { const d = new Date(ts); const p = n => (n < 10 ? '0' + n : n); return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
      const openBoard = (r) => {
        setBoard({ id: r.id, name: r.name });
        setReplyTo(null);
        setMsgs([
          { id: 1, nickname: '苏叶', content: '今晚一起冲 25 分钟！', created_at: Date.now() - 600e3, depth: 0, reply_to_name: null },
          { id: 2, nickname: '林小满', content: '好呀，我先开始～', created_at: Date.now() - 300e3, depth: 1, reply_to_name: '苏叶' },
        ]);
      };
      const sendMsg = () => {
        const t = msgInput.trim();
        if (!t) { showToast('请输入留言内容', null); return; }
        setMsgs(m => [...m, { id: Date.now(), nickname: '我', content: t, created_at: Date.now(), depth: replyTo ? 1 : 0, reply_to_name: replyTo }]);
        setMsgInput(''); setReplyTo(null);
        showToast('已发送', I.check(15, T.leaf));
      };
      const createRoom = () => {
        const name = newName.trim();
        if (!name) { showToast('请输入自习室名称', null); return; }
        const id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
        setRooms(rs => [{ id, name, role: 'owner', member_count: 1, need_password: usePwd, created_at: Date.now() }, ...rs]);
        setShowCreate(false); setNewName(''); setUsePwd(false); setNewPwd('');
        showToast(`自习室「${name}」已创建`, I.check(15, T.leaf));
      };
      const joinRoom = () => {
        const code = joinCode.trim();
        if (!code) { showToast('请输入房间号', null); return; }
        if (rooms.some(r => r.id === code)) { showToast('已在房间中', null); return; }
        setRooms(rs => [{ id: code, name: '新加入的自习室', role: 'member', member_count: 2, need_password: !!joinPwd, created_at: Date.now() }, ...rs]);
        setShowJoin(false); setJoinCode(''); setJoinPwd('');
        showToast('已加入房间', I.check(15, T.leaf));
      };
      const confirmDo = () => {
        if (!confirmRoom) return;
        const act = confirmRoom.action;
        setRooms(rs => rs.filter(r => r.id !== confirmRoom.room.id));
        setConfirmRoom(null);
        showToast(act === 'delete' ? '已解散自习室' : '已退出自习室', null);
      };

      return (
        <div style={{ height: '100%', background: T.bg, overflow: 'auto', padding: '22px 22px 10px' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
            <div>
              <div className="serif" style={{ fontSize: 24 }}>自习室</div>
              <div style={{ fontSize: 12, color: T.ink2, marginTop: 3 }}>和好友一起，专注不孤单</div>

                      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>

                    </div>
                    <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
                      <span onClick={() => openBoard(r)} style={{ cursor: 'pointer', fontSize: 16 }}>💬</span>
                      <span onClick={() => setConfirmRoom({ room: r, action: r.role === 'owner' ? 'delete' : 'leave' })} style={{ cursor: 'pointer', fontSize: 13, color: T.ink3 }}>✕</span>
                    </div>
                  </div>
                  <div style={{ marginTop: 10 }}>
                    <div onClick={() => onStart({ title: `在「${r.name}」专注`, pomos: 1, difficulty: 'medium' })} style={{ display: 'inline-block', cursor: 'pointer', fontSize: 12.5, fontWeight: 600, color: T.leafDeep, background: T.leafSoft, padding: '7px 14px', borderRadius: 99 }}>开始自习</div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {board && (
            <Modal onClose={() => setBoard(null)} width={320}>
              <div className="serif" style={{ fontSize: 17 }}>房间留言</div>
              <div style={{ fontSize: 11.5, color: T.ink3, marginTop: 2, marginBottom: 12, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{board.name}</div>
              {replyTo && (
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '6px 10px', background: T.leafSoft, borderRadius: 8, marginBottom: 8 }}>
                  <span style={{ fontSize: 11.5, color: T.leafDeep }}>回复 @{replyTo}</span>
                  <span onClick={() => setReplyTo(null)} style={{ fontSize: 11.5, color: T.ink3, cursor: 'pointer' }}>取消</span>
                </div>

              <div style={{ display: 'flex', gap: 8 }}>

                <div onClick={sendMsg} style={{ padding: '10px 16px', borderRadius: 10, background: T.leaf, color: '#fff', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>发送</div>
              </div>
              <div style={{ marginTop: 14, maxHeight: 300, overflow: 'auto' }}>
                {msgs.length === 0 ? (
                  <div style={{ fontSize: 12, color: T.ink3, textAlign: 'center', padding: '18px 0' }}>还没有留言，来说点什么吧</div>
                ) : msgs.map(m => (
                  <div key={m.id} style={{ display: 'flex', gap: 8, padding: '8px 0', paddingLeft: (m.depth || 0) * 16 }}>
                    <div style={{ width: 28, height: 28, borderRadius: 14, background: T.leaf, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 600, flexShrink: 0 }}>{(m.nickname || '匿')[0]}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                        <span style={{ fontSize: 12.5, fontWeight: 600 }}>{m.nickname}</span>
                        <span style={{ fontSize: 10.5, color: T.ink3 }}>{fmt(m.created_at)}</span>
                      </div>
                      <div style={{ fontSize: 13, lineHeight: 1.5, marginTop: 3 }}>{m.reply_to_name ? `回复 @${m.reply_to_name}：` : ''}{m.content}</div>
                      <div onClick={() => setReplyTo(m.nickname)} style={{ fontSize: 10.5, color: T.leafDeep, marginTop: 4, cursor: 'pointer' }}>回复</div>
                    </div>
                  </div>
                ))}
              </div>
            </Modal>
          )}

          {showCreate && (
            <Modal onClose={() => setShowCreate(false)} width={300}>
              <div className="serif" style={{ fontSize: 17, marginBottom: 6 }}>创建自习室</div>
              <div style={{ fontSize: 11.5, color: T.ink3, marginBottom: 14 }}>起个名字，喊上好友一起学</div>
              <input value={newName} onChange={e => setNewName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') createRoom(); }} placeholder="自习室名称" autoFocus style={{ width: '100%', padding: '12px 14px', borderRadius: 12, border: `1px solid ${T.line}`, fontSize: 14, fontFamily: T.body, color: T.ink, outline: 'none', background: T.surface2, boxSizing: 'border-box' }} />
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 14 }}>
                <span style={{ fontSize: 13 }}>设置密码</span>
                <Switch on={usePwd} onToggle={() => setUsePwd(v => !v)} />
              </div>
              {usePwd && (
                <input value={newPwd} onChange={e => setNewPwd(e.target.value)} type="password" placeholder="房间密码" style={{ width: '100%', padding: '12px 14px', borderRadius: 12, border: `1px solid ${T.line}`, fontSize: 14, fontFamily: T.body, color: T.ink, outline: 'none', background: T.surface2, boxSizing: 'border-box', marginTop: 10 }} />
              )}
              <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
                <div onClick={() => setShowCreate(false)} style={{ flex: 1, padding: '11px', borderRadius: 12, border: `1px solid ${T.line}`, color: T.ink2, fontSize: 14, cursor: 'pointer', textAlign: 'center' }}>取消</div>
                <div onClick={createRoom} style={{ flex: 1, padding: '11px', borderRadius: 12, background: T.leaf, color: '#fff', fontSize: 14, cursor: 'pointer', textAlign: 'center', fontWeight: 600 }}>创建</div>
              </div>
            </Modal>
          )}

          {showJoin && (
            <Modal onClose={() => setShowJoin(false)} width={300}>
              <div className="serif" style={{ fontSize: 17, marginBottom: 6 }}>加入自习室</div>
              <div style={{ fontSize: 11.5, color: T.ink3, marginBottom: 14 }}>输入好友分享的房间号</div>
              <input value={joinCode} onChange={e => setJoinCode(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') joinRoom(); }} placeholder="房间号" autoFocus style={{ width: '100%', padding: '12px 14px', borderRadius: 12, border: `1px solid ${T.line}`, fontSize: 14, fontFamily: T.body, color: T.ink, outline: 'none', background: T.surface2, boxSizing: 'border-box' }} />
              <input value={joinPwd} onChange={e => setJoinPwd(e.target.value)} type="password" placeholder="房间密码（没有可不填）" style={{ width: '100%', padding: '12px 14px', borderRadius: 12, border: `1px solid ${T.line}`, fontSize: 14, fontFamily: T.body, color: T.ink, outline: 'none', background: T.surface2, boxSizing: 'border-box', marginTop: 10 }} />
              <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
                <div onClick={() => setShowJoin(false)} style={{ flex: 1, padding: '11px', borderRadius: 12, border: `1px solid ${T.line}`, color: T.ink2, fontSize: 14, cursor: 'pointer', textAlign: 'center' }}>取消</div>
                <div onClick={joinRoom} style={{ flex: 1, padding: '11px', borderRadius: 12, background: T.leaf, color: '#fff', fontSize: 14, cursor: 'pointer', textAlign: 'center', fontWeight: 600 }}>加入</div>
              </div>
            </Modal>
          )}

          {confirmRoom && (
            <Modal onClose={() => setConfirmRoom(null)} width={290}>
              <div className="serif" style={{ fontSize: 17, marginBottom: 6, textAlign: 'center' }}>{confirmRoom.action === 'delete' ? '解散自习室？' : '退出自习室？'}</div>
              <div style={{ fontSize: 12.5, color: T.ink2, lineHeight: 1.6, textAlign: 'center' }}>「{confirmRoom.room.name}」{confirmRoom.action === 'delete' ? '及其留言将不可见。' : '退出后可重新加入。'}</div>
              <div style={{ display: 'flex', gap: 10, marginTop: 18 }}>
                <div onClick={() => setConfirmRoom(null)} style={{ flex: 1, padding: '11px', borderRadius: 12, border: `1px solid ${T.line}`, color: T.ink2, fontSize: 14, cursor: 'pointer', textAlign: 'center' }}>取消</div>
                <div onClick={confirmDo} style={{ flex: 1, padding: '11px', borderRadius: 12, background: T.tomato, color: '#fff', fontSize: 14, cursor: 'pointer', textAlign: 'center', fontWeight: 600 }}>{confirmRoom.action === 'delete' ? '解散' : '退出'}</div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

              <div>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 4, marginBottom: 6 }}>
                  <span className="serif" style={{ fontSize: 22, lineHeight: 1, color: T.ink }}>{doneCount}<span style={{ fontSize: 12, color: T.ink3 }}> / {goal} 番茄</span></span>
                  <span style={{ fontSize: 10, color: T.ink3, marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 2 }}>{I.flame(11, T.tomato)} 连签 {streakDays} 天</span>
                </div>
                <div style={{ height: 6, borderRadius: 99, background: T.surface2, overflow: 'hidden' }}>
                  <div style={{ width: `${pct}%`, height: '100%', background: reached ? T.gold : T.leaf, borderRadius: 99, transition: 'width 0.4s' }} />
                </div>
              </div>
            </div>
          );
        }
        // 4x4 大卡
        return (
          <div style={{ width: 212, height: 212, background: T.surface, borderRadius: 22, border: `1px solid ${T.line}`, boxShadow: '0 14px 34px rgba(0,0,0,0.12)', padding: 15, display: 'flex', flexDirection: 'column' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, color: T.ink2 }}>{I.tomato(16, T.tomato)}<span style={{ fontSize: 12, fontWeight: 600 }}>青番 · 今日专注</span></div>
              <span style={{ fontSize: 10, color: reached ? T.gold : T.ink3, fontWeight: 600 }}>{reached ? '✓ 达成' : '进行中'}</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
              <span className="serif" style={{ fontSize: 34, lineHeight: 1, color: T.ink }}>{doneCount}</span>
              <span style={{ fontSize: 13, color: T.ink3 }}>/ {goal} 番茄</span>
            </div>
            <div style={{ height: 7, borderRadius: 99, background: T.surface2, overflow: 'hidden', marginTop: 10 }}>
              <div style={{ width: `${pct}%`, height: '100%', background: reached ? T.gold : T.leaf, borderRadius: 99, transition: 'width 0.4s' }} />
            </div>
            <div style={{ display: 'flex', gap: 10, marginTop: 14, flex: 1 }}>
              <div style={{ flex: 1, background: T.surface2, borderRadius: 13, padding: '10px 11px', display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 5 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 5, color: T.leafDeep }}>{I.tree(14)}<span style={{ fontSize: 10.5, color: T.ink2 }}>森林</span></div>
                <div className="serif" style={{ fontSize: 18, color: T.ink }}>{trees}<span style={{ fontSize: 10, color: T.ink3 }}> 棵</span></div>
              </div>
              <div style={{ flex: 1, background: T.surface2, borderRadius: 13, padding: '10px 11px', display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 5 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 5, color: T.tomato }}>{I.flame(14)}<span style={{ fontSize: 10.5, color: T.ink2 }}>连签</span></div>
                <div className="serif" style={{ fontSize: 18, color: T.ink }}>{streakDays}<span style={{ fontSize: 10, color: T.ink3 }}> 天</span></div>
              </div>
            </div>
            <div style={{ marginTop: 10, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 5, padding: '9px', borderRadius: 12, background: T.leaf, color: '#fff', fontSize: 12.5, fontWeight: 600 }}>{I.play(14)} 开始专注</div>
          </div>
        );
      };
      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', position: 'relative', overflow: 'hidden', background: `linear-gradient(160deg, var(--brand-grad-1) 0%, var(--brand-grad-2) 100%)` }}>
          {/* 壁纸装饰 */}
          <svg viewBox="0 0 400 300" style={{ position: 'absolute', left: 0, bottom: -20, width: '100%', opacity: 0.16, pointerEvents: 'none' }}>
            <path d="M-20 320C60 180 160 120 260 140c80 16 120 60 160 120-40-20-80-20-120 0s-80 40-140 40Z" fill={T.leaf} />
            <path d="M220 300c-10-60 20-110 70-140-10 70-30 110-70 140Z" fill={T.leafDeep} />
          </svg>

          {/* 顶栏 */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 18px 4px', position: 'relative', zIndex: 2 }}>
            <div>
              <div className="serif" style={{ fontSize: 20, color: T.ink }}>桌面小组件</div>
              <div style={{ fontSize: 11, color: T.ink2, marginTop: 2 }}>把专注进度放到手机桌面</div>
            </div>
            <div onClick={onBack} aria-label="关闭小组件" style={{ cursor: 'pointer', color: T.ink2, background: T.surface, border: `1px solid ${T.line}`, width: 34, height: 34, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{I.x(18)}</div>
          </div>

          {/* 桌面主体 */}
          <div style={{ flex: 1, position: 'relative', zIndex: 2, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 18, padding: '8px 0' }}>
            {/* 模拟应用图标 */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12 }}>
              {apps.map((a, i) => (
                <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
                  <div style={{ width: 40, height: 40, borderRadius: 12, background: a.c, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, fontWeight: 600, boxShadow: '0 4px 10px rgba(0,0,0,0.12)' }}>{a.n}</div>
                </div>
              ))}
            </div>
            {/* 小组件预览 */}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: 216 }}>
              {renderWidget(size)}
            </div>
          </div>

          {/* 底部控制 */}
          <div style={{ position: 'relative', zIndex: 2, background: 'var(--bar)', backdropFilter: 'blur(10px)', borderTop: `1px solid ${T.line}`, padding: '14px 18px 16px' }}>
            <div style={{ fontSize: 11, color: T.ink3, marginBottom: 10 }}>选择尺寸</div>
            <div style={{ display: 'flex', gap: 10 }}>
              {sizes.map(s => {
                const active = size === s.key;
                return (
                  <div key={s.key} onClick={() => setSize(s.key)} style={{ flex: 1, padding: '10px 0', borderRadius: 13, textAlign: 'center', cursor: 'pointer', background: active ? T.leafSoft : T.surface2, border: active ? `1.5px solid ${T.leaf}` : `1px solid ${T.line}`, transition: 'all 0.15s' }}>
                    <div style={{ fontSize: 14, fontWeight: 700, color: active ? T.leafDeep : T.ink }}>{s.label}</div>
                    <div style={{ fontSize: 10, color: T.ink3, marginTop: 1 }}>{s.desc}</div>
                  </div>
                );
              })}
            </div>
            <div onClick={() => { if (!added) { setAdded(true); showToast('已添加到桌面，随时查看专注进度', I.grid(15, T.leaf)); } }} style={{ marginTop: 12, padding: '13px', borderRadius: 14, textAlign: 'center', fontSize: 14.5, fontWeight: 600, cursor: added ? 'default' : 'pointer', background: added ? T.surface2 : T.leaf, color: added ? T.ink2 : '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, transition: 'all 0.2s' }}>
              {added ? I.check(16) : I.plus(16)}{added ? '已添加到桌面' : '添加到桌面'}
            </div>
          </div>
        </div>
      );
    }

    /* ============================================================
       TabBar
    ============================================================ */
    function TabBar({ tab, onChange }) {
      const items = [
        { id: 'home', label: '今日', icon: I.leaf },
        { id: 'study', label: '自习室', icon: I.users },
        { id: 'stats', label: '统计', icon: I.chart },
        { id: 'me', label: '我的', icon: I.user },
      ];
      return (
        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, height: 64, background: 'var(--bar)', backdropFilter: 'blur(10px)', borderTop: `1px solid ${T.line}`, display: 'flex', zIndex: 20 }}>
          {items.map(it => {
            const active = tab === it.id;
            return (
              <div key={it.id} onClick={() => onChange(it.id)} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 3, cursor: 'pointer', color: active ? T.leafDeep : T.ink3 }}>
                {it.icon(22)}
                <span style={{ fontSize: 10.5, fontWeight: active ? 600 : 400 }}>{it.label}</span>
              </div>
            );
          })}
        </div>
      );
    }

    /* ============================================================
       App 状态机
    ============================================================ */
    function App() {
      const [appState, setAppState] = useState('onboarding'); // onboarding | login | main | focus
      const [tab, setTab] = useState('home');
      const [loggedIn, setLoggedIn] = useState(false); // 访客模式：未登录可用待办+计时
      const [signed, setSigned] = useState(false);
      const [exp, setExp] = useState(2450);
      const [level, setLevel] = useState(12);
      const [trees, setTrees] = useState(5);       // 已种下的树
      const [withered, setWithered] = useState(1);  // 中断而枯萎的树
      const [streakDays, setStreakDays] = useState(12); // 连续签到天数
      const [challengeGoal, setChallengeGoal] = useState(4); // 每日挑战目标番茄数（可自定义）
      const [showGoalPicker, setShowGoalPicker] = useState(false);
      const [focusTask, setFocusTask] = useState(null);
      const [showAdd, setShowAdd] = useState(false);
      const [showComplete, setShowComplete] = useState(false);
      const [completedTask, setCompletedTask] = useState(null);
      const [tasks, setTasks] = useState([
        { id: 1, title: '晨间阅读《心流》30 页', pomos: 1, done: true, difficulty: 'easy' },
        { id: 2, title: '写本周工作周报', pomos: 2, done: false, difficulty: 'hard' },
        { id: 3, title: '背 30 个英语单词', pomos: 1, done: false, difficulty: 'medium' },
        { id: 4, title: '读《认知觉醒》第三章', pomos: 1, done: false, difficulty: 'medium' },
      ]);
      const [newTitle, setNewTitle] = useState('');
      const [showAi, setShowAi] = useState(false);
      const [theme, setTheme] = useState('green');       // 背景主题：green | dark | dawn | ocean
      const [showWidget, setShowWidget] = useState(false); // 桌面小组件预览
      const [toast, setToast] = useState(null);
      const toastTimer = useRef(null);
      const showToast = (msg, icon) => {
        if (toastTimer.current) clearTimeout(toastTimer.current);
        setToast({ msg, icon, id: Date.now() });
        toastTimer.current = setTimeout(() => setToast(null), 1600);
      };

      const handleLogin = () => { setLoggedIn(true); setAppState('main'); };
      const goLogin = () => setAppState('login');
      const requireLogin = (msg) => {
        if (loggedIn) return true;
        showToast(msg || '登录后即可使用，请到「我的」登录', I.lock(15));
        setTab('me');
        return false;
      };
      const handleSign = () => {
        if (!loggedIn) { requireLogin('登录后即可签到'); return; }
        if (!signed) { setSigned(true); setStreakDays(d => d + 1); setExp(e => e + 10 + (streakDays >= 7 ? 5 : 0)); showToast(`签到成功 +${10 + (streakDays >= 7 ? 5 : 0)} 经验`, I.gift(15)); }
      };
      const handleStart = (t) => { setFocusTask(t); setAppState('focus'); };
      const handleToggleDone = (id) => {
        setTasks(ts => ts.map(t => {
          if (t.id === id) {
            const nd = !t.done;
            if (nd) { setExp(e => e + t.pomos * 20); showToast(`完成「${t.title}」 +${t.pomos * 20} 经验`, I.star(15)); }
            return { ...t, done: nd };
          }
          return t;
        }));
      };
      const handleAdd = () => {
        if (newTitle.trim()) {
          setTasks(ts => [...ts, { id: Date.now(), title: newTitle.trim(), pomos: 1, done: false, difficulty: 'medium' }]);
          setNewTitle('');
        }
        setShowAdd(false);
      };
      const handleReorder = (from, to) => {
        setTasks(ts => {
          const arr = [...ts];
          const [moved] = arr.splice(from, 1);
          arr.splice(to, 0, moved);
          return arr;
        });
      };
      const handleAiSort = () => {
        setTasks(ts => {
          const order = { hard: 0, medium: 1, easy: 2 };
          return [...ts].sort((a, b) => (order[a.difficulty] ?? 3) - (order[b.difficulty] ?? 3));
        });
      };
      const handleComplete = () => {
        setCompletedTask(focusTask);
        setShowComplete(true);
        setTasks(ts => ts.map(t => t.id === focusTask.id ? { ...t, done: true } : t));
        setExp(e => e + focusTask.pomos * 20);
        setTrees(t => t + 1);
      };
      const handleQuit = () => { setWithered(w => w + 1); showToast('专注中断，小树苗枯萎了', I.tree(15, T.tomato)); setAppState('main'); setFocusTask(null); };
      const handleRevive = () => {
        if (exp < 50) { showToast('经验不足，再专注几次来复活它吧', I.tree(15, T.ink3)); return; }
        if (withered <= 0) return;
        setWithered(w => w - 1);
        setTrees(t => t + 1);
        setExp(e => e - 50);
        showToast('成功复活 1 棵树，森林又绿了', I.leaf(15));
      };
      const handleCompleteClose = () => { setShowComplete(false); setAppState('main'); setFocusTask(null); };
      const handleLogout = () => { setLoggedIn(false); setTab('home'); setAppState('main'); };

      // 背景主题切换
      useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
      const themeLabels = { green: '青番绿', dark: '深夜墨', dawn: '晨光暖', ocean: '静谧蓝' };
      const handleSetTheme = (key) => { setTheme(key); showToast(`已切换到「${themeLabels[key]}」主题`, I.palette(15)); };

      // 设备自适应缩放
      const [scale, setScale] = useState(1);
      useEffect(() => {
        const calc = () => {
          const s = Math.min((window.innerHeight - 40) / 840, (window.innerWidth - 40) / 1460, 1.05);
          setScale(Math.max(0.5, Math.min(s, 1.05)));
        };
        calc();
        window.addEventListener('resize', calc);
        return () => window.removeEventListener('resize', calc);
      }, []);

      const renderScreen = () => {
        if (appState === 'onboarding') return <ScreenOnboarding onDone={() => setAppState('main')} />;
        if (appState === 'login') return <ScreenLogin onLogin={handleLogin} />;
        if (appState === 'focus') return <ScreenFocus task={focusTask} onQuit={handleQuit} onComplete={handleComplete} />;
        switch (tab) {
          case 'home': return <ScreenHome onStart={handleStart} onAdd={() => setShowAdd(true)} signed={signed} onSign={handleSign} tasks={tasks} onToggleDone={handleToggleDone} onReorder={handleReorder} onAiSort={handleAiSort} onOpenAi={() => { if (requireLogin('登录后即可使用 AI 助手')) setShowAi(true); }} challengeGoal={challengeGoal} onEditGoal={() => setShowGoalPicker(true)} />;
          case 'study': return <ScreenStudyRoom onStart={handleStart} showToast={showToast} />;
          case 'stats': return <ScreenStats />;
          case 'me': return <ScreenMe loggedIn={loggedIn} onLogin={goLogin} signed={signed} onSign={handleSign} exp={exp} level={level} trees={trees} withered={withered} streakDays={streakDays} onRevive={handleRevive} onLogout={handleLogout} theme={theme} onSetTheme={handleSetTheme} onOpenWidget={() => setShowWidget(true)} />;
          default: return null;
        }
      };

      const modules = [
        { name: '登录与账户', active: appState === 'login' },
        { name: '待办与今日计划', active: tab === 'home' },
        { name: '每日挑战目标', active: tab === 'home' },
        { name: '专注倒计时（锁屏）', active: appState === 'focus' },
        { name: '背景 / 白噪音切换', active: appState === 'focus' },
        { name: '数据统计与 AI 分析', active: tab === 'stats' },
        { name: '每日完成时间轴', active: tab === 'stats' },
        { name: '签到 · 经验值 · 等级', active: tab === 'me' },
        { name: '连续签到打卡日历', active: tab === 'me' },
        { name: '专注森林 · 种树激励', active: tab === 'me' },
        { name: '自习室 · 共同自习', active: tab === 'study' },
        { name: 'AI 智能助手', active: showAi },
        { name: '背景主题切换', active: tab === 'me' },
        { name: '桌面小组件', active: showWidget },
      ];

      return (
        <div className="stage-wrap">
          <div className="stage-side">
            <div className="stage-brand">
              <div className="mark"><LeafLogo size={44} /></div>
              <div>
                <div className="name">青番</div>
                <div className="en">QINGFAN · AI POMODORO</div>
              </div>
            </div>
            <div className="stage-tagline">把专注，种成一片森林。<br />一款会陪你成长的 AI 番茄钟智能助手。<br /><b style={{ color: T.leafDeep }}>Web 端原型</b>（功能与鸿蒙端一致）</div>
            <div className="stage-modules">
              <div className="title">功能模块</div>
              {modules.map((m, i) => (
                <div key={i} className={`stage-module ${m.active ? 'done' : ''}`}>
                  <span className="dot" />
                  <span>{m.name}</span>
                  <span className="num">{String(i + 1).padStart(2, '0')}</span>
                </div>
              ))}
            </div>
            <div className="stage-hint">
              <b>Web 端操作提示</b><br />开场引导看「为什么选青番」· 访客可直接用待办与计时；登录后解锁 AI / 统计 / 自习室 · 首页看「今日挑战」进度，点「调整」自定义目标 · 「我的」看森林与打卡、切换主题 · 长按待办拖动排序 · 点 AI 卡片进助手 · 自习室可创建/按房间号加入并留言。
            </div>
          </div>

          <div className="phone-col" style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}>
            <BrowserFrame dark={theme === 'dark'}>
              <div style={{ display: 'flex', height: '100%', width: '100%' }}>
                {appState === 'main' && <SideBar tab={tab} appState={appState} theme={theme} loggedIn={loggedIn} onLogin={goLogin} onSetTheme={handleSetTheme} onChange={(id) => {
                  if ((id === 'stats' || id === 'study') && !loggedIn) { requireLogin('登录后即可使用，请到「我的」登录'); return; }
                  setTab(id);
                }} />}
                <div style={{ position: 'relative', flex: 1, overflow: 'hidden', background: T.bg }}>
                  <div key={appState === 'main' ? tab : appState} style={{ height: '100%', animation: 'fadeUp 0.28s ease' }}>
                    <div style={{ maxWidth: 680, margin: '0 auto', height: '100%' }}>{renderScreen()}</div>
                  </div>

                {/* AI 助手全屏覆盖层 */}
                {showAi && (
                  <div style={{ position: 'absolute', inset: 0, zIndex: 50, background: T.bg, animation: 'fadeUp 0.25s ease' }}>
                    <ScreenAi onBack={() => setShowAi(false)} onAiSort={handleAiSort} />
                  </div>
                )}

                {/* 桌面小组件预览覆盖层 */}
                {showWidget && (
                  <div style={{ position: 'absolute', inset: 0, zIndex: 60, background: T.bg, animation: 'fadeUp 0.25s ease' }}>
                    <ScreenWidget onBack={() => setShowWidget(false)} trees={trees} withered={withered} streakDays={streakDays} challengeGoal={challengeGoal} doneCount={tasks.filter(t => t.done).length} showToast={showToast} />
                  </div>
                )}

                {/* 轻提示 */}
                {toast && <Toast key={toast.id} msg={toast.msg} icon={toast.icon} />}

                {/* 添加待办弹窗 */}
                {showAdd && (
                  <Modal onClose={() => setShowAdd(false)} width={290}>
                    <div className="serif" style={{ fontSize: 17, marginBottom: 14 }}>添加待办</div>
                    <input value={newTitle} onChange={e => setNewTitle(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') handleAdd(); }} placeholder="想专注做什么？" autoFocus style={{ width: '100%', padding: '12px 14px', borderRadius: 12, border: `1px solid ${T.line}`, fontSize: 14, fontFamily: T.body, color: T.ink, outline: 'none', background: T.surface2 }} />
                    <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
                      <div onClick={() => setShowAdd(false)} style={{ flex: 1, padding: '11px', borderRadius: 12, border: `1px solid ${T.line}`, color: T.ink2, fontSize: 14, cursor: 'pointer', textAlign: 'center' }}>取消</div>
                      <div onClick={handleAdd} style={{ flex: 1, padding: '11px', borderRadius: 12, background: T.leaf, color: '#fff', fontSize: 14, cursor: 'pointer', textAlign: 'center', fontWeight: 600 }}>添加</div>
                    </div>
                  </Modal>
                )}

                {/* 挑战目标设置弹窗 */}
                {showGoalPicker && (
                  <Modal onClose={() => setShowGoalPicker(false)} width={300}>
                    <div style={{ textAlign: 'center' }}>
                      <div style={{ width: 48, height: 48, borderRadius: 14, background: T.goldSoft, display: 'flex', alignItems: 'center', justifyContent: 'center', color: T.gold, margin: '0 auto' }}>{I.trophy(28)}</div>
                      <div className="serif" style={{ fontSize: 17, marginTop: 12 }}>自定义每日挑战</div>
                      <div style={{ fontSize: 12, color: T.ink2, marginTop: 4 }}>每天想专注几个番茄？达成奖励 +50 经验</div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10, marginTop: 16 }}>
                        {[2, 4, 6, 8].map(g => (
                          <div key={g} onClick={() => { setChallengeGoal(g); setShowGoalPicker(false); showToast(`今日目标已设为 ${g} 个番茄`, I.trophy(15, T.gold)); }} style={{
                            padding: '14px 0', borderRadius: 14, textAlign: 'center', cursor: 'pointer',
                            background: challengeGoal === g ? T.leaf : T.surface2,
                            color: challengeGoal === g ? '#fff' : T.ink,
                            border: challengeGoal === g ? '1px solid transparent' : `1px solid ${T.line}`,
                            fontSize: 17, fontWeight: 700, transition: 'all 0.15s',
                          }}>{g}</div>
                        ))}
                      </div>
                      <div style={{ fontSize: 11, color: T.ink3, marginTop: 12 }}>目标越高越有挑战，完成后经验照常到账。</div>
                    </div>
                  </Modal>
                )}

                {/* 完成庆祝弹窗 */}
                {showComplete && (
                  <Modal onClose={handleCompleteClose} width={290}>
                    <div style={{ textAlign: 'center' }}>
                      <div style={{ display: 'flex', justifyContent: 'center', position: 'relative', height: 60 }}>
                        {[0,1,2,3,4].map(i => (
                          <span key={i} style={{ position: 'absolute', left: `calc(50% + ${(i-2)*18}px)`, top: 8, width: 8, height: 8, borderRadius: i%2? '50%' : '3px', background: i%2 ? T.tomato : T.leaf, animation: `confetti 1.2s ${i*0.1}s ease infinite` }} />
                        ))}
                        <div style={{ animation: 'floatY 2.5s ease-in-out infinite' }}>{I.tomato(46, T.tomato)}</div>
                      </div>
                      <div className="serif" style={{ fontSize: 19, marginTop: 8 }}>专注完成！</div>
                      <div style={{ fontSize: 12.5, color: T.ink2, marginTop: 6, lineHeight: 1.6 }}>「{completedTask?.title}」已完成</div>
                      <div style={{ display: 'flex', justifyContent: 'center', gap: 12, margin: '14px 0' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 12.5, color: T.ink2 }}>{I.flame(15, T.tomato)} 番茄 +1</div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 12.5, color: T.ink2 }}>{I.star(15, T.gold)} 经验 +{completedTask ? completedTask.pomos * 20 : 0}</div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 12.5, color: T.leafDeep }}>{I.tree(15)} 种下 1 棵树</div>
                      </div>
                      <div onClick={handleCompleteClose} style={{ padding: '12px', borderRadius: 13, background: T.leaf, color: '#fff', fontSize: 14, cursor: 'pointer', textAlign: 'center', fontWeight: 600 }}>太棒了</div>
                    </div>
                  </Modal>
                )}
                </div>
              </div>
            </BrowserFrame>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
